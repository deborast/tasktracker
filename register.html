<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Tracker Tugas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
            <h3 class="text-center mb-4 auth-title">Daftar Akun Baru</h3>
            <form id="registerForm">
                <div class="mb-3">
                    <input type="text" id="regNama" class="form-control" placeholder="Nama Panggilan" required>
                </div>
                <div class="mb-3">
                    <input type="email" id="regEmail" class="form-control" placeholder="Email" required>
                </div>
                <div class="mb-4">
                    <input type="password" id="regPassword" class="form-control" placeholder="Password (Min 6 Karakter)" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Register</button>
                <p class="text-center mb-0">Sudah punya akun? <a href="index.html" class="auth-link">Login di sini</a></p>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nama = document.getElementById('regNama').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: nama });
                alert("Registrasi berhasil! Silakan login.");
                window.location.href = "index.html";
            } catch (error) {
                alert("Error: " + error.message);
            }
        });
    </script>
</body>
</html>
