<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tracker Tugas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
            <h3 class="text-center mb-4 auth-title">Login Tracker</h3>
            <form id="loginForm">
                <div class="mb-3">
                    <input type="email" id="logEmail" class="form-control" placeholder="Email" required>
                </div>
                <div class="mb-4">
                    <input type="password" id="logPassword" class="form-control" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
                <p class="text-center mb-0">Belum punya akun? <a href="register.html" class="auth-link">Daftar sekarang</a></p>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (user && user.emailVerified) {
                window.location.href = "dashboard.html";
            } else if (user && !user.emailVerified) {
                signOut(auth);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('logEmail').value;
            const password = document.getElementById('logPassword').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                if (user.emailVerified) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil Login!',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        window.location.href = "dashboard.html";
                    });
                } else {
                    await signOut(auth);
                    Swal.fire({
                        icon: 'warning',
                        title: 'Email Belum Diverifikasi',
                        text: 'Silakan cek email Anda dan klik link verifikasi sebelum login.'
                    });
                }
            } catch (error) {
                let pesanError = "Terjadi kesalahan sistem.";
                if (error.code === 'auth/user-not-found') {
                    pesanError = "Akun tidak ditemukan. Silakan daftar terlebih dahulu.";
                } else if (error.code === 'auth/wrong-password') {
                    pesanError = "Password yang Anda masukkan salah.";
                } else if (error.code === 'auth/invalid-credential') {
                    pesanError = "Akun tidak ditemukan atau password salah.";
                }
                
                Swal.fire('Gagal Login', pesanError, 'error');
            }
        });
    </script>
</body>
</html>
