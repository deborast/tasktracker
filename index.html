<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Tugas Kuliah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Tracker Tugas Kuliah</h2>
        

        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form id="tugasForm">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <input type="text" id="matkul" class="form-control" placeholder="Mata Kuliah" required>
                        </div>
                        <div class="col-md-3">
                            <input type="text" id="namaTugas" class="form-control" placeholder="Nama Tugas" required>
                        </div>
                        <div class="col-md-3">
                            <input type="date" id="deadline" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <select id="prioritas" class="form-select">
                                <option value="Biasa">Biasa</option>
                                <option value="Tinggi">Tinggi</option>
                            </select>
                        </div>
                        <div class="col-md-1">
                            <button type="submit" class="btn btn-primary w-100">Add</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Mata Kuliah</th>
                            <th>Tugas</th>
                            <th>Deadline</th>
                            <th>Prioritas</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelTugas">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
